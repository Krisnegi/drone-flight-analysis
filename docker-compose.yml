version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: drone-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drone_flight
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: drone-redis
    ports:
      - "6379:6379"
    restart: always

  mosquitto:
    build: ./mosquitto
    container_name: drone-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: always

volumes:
  pgdata:
